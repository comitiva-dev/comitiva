name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  build:
    name: Package and smoke test (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds (docs/development.md → Code signing).
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm package
      # The runner, the MCP proxy and both built-in servers start from the packaged app.
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: pnpm --filter desktop test:packaged
      - name: Smoke test the packaged app (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter desktop test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: comitiva-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest*.yml
          if-no-files-found: error
      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: apps/desktop/test-results/packaged/
          if-no-files-found: ignore
